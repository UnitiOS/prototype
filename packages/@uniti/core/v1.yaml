id: https://w3id.org/uniti/core
name: uniti_core
version: v1
title: Uniti core
description: 'The root module. It holds only what a mechanism already executes, so
  that every module importing it is standing on something that does work rather than
  on a vocabulary nothing reads. Today that is one slot: the predicate under which
  an entity states which class it is. The generator reads it to decide which rows
  belong to which table, and it is one predicate across every module, so a class fact
  written by one module is the same fact to all of them.'
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://w3id.org/uniti/core#
default_prefix: uniti
default_range: string
imports:
- linkml:types
classes: {}
slots:
  entity_class:
    title: Class
    slot_uri: uniti:entity_class
    designates_type: true
    range: string
    description: Which class this entity is an instance of. Stated, never inferred.
