name: "@uniti/core"
version: "1.0.0"
title: "UnitiOS Foundational Archetypes and Metamodel"
description: "The immutable root metamodel defining the 5 foundational archetypes (Agent, Resource, Commitment, Event, Projection) and universal semantic primitives."
author: "Uniti Architecture Team"
license: "Apache-2.0"
exports:
  classes:
    - CoreClass
    - Agent
    - Resource
    - Commitment
    - Event
    - Projection
  slots:
    - entity_class
    - agent_id
    - agent_name
    - resource_id
    - resource_name
    - standard_unit
    - commitment_id
    - commitment_status
    - event_id
    - event_kind
    - happened_at
    - projection_id
