    slots:
    - party_name
    - party_kind
    structured_aliases:
    - literal_form: Pihak
      in_language: id
      predicate: EXACT_SYNONYM
slots:
  party_name:
    slot_uri: party:party_name
    title: Name
    description: The name the party is known by in this business, which is how somebody
      picks it out when recording what it took part in.
