id: https://w3id.org/uniti/item
name: uniti_item
version: v2
title: Item
description: A kind of thing a business holds, counts, moves, buys, sells or rents
  out, recorded once and pointed at by every module that deals with it. What one kind
  of business adds about an item, such as a rental rate or a reorder level, is a slot
  of that business's own module attached to the item, so the item stays one record
  and each business's facts stay its own.
