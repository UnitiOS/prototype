id: https://uniti.example/business
name: business
version: v1
title: Usaha eskrim — toko dengan produksi sendiri
description: Toko eskrim yang juga memproduksi di tempat yang sama. Fokus sesi ini
  adalah persediaan.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://uniti.example/business/
default_prefix: uniti
imports:
- linkml:types
default_range: string
classes:
  Toko:
    description: Tempat usaha. Orang datang ke sini, dan eskrimnya dibuat di sini
      juga.
    slots:
    - toko_produksi_sendiri
  Rasa:
    description: Satu rasa eskrim. Stok dihitung per rasa.
    slots:
    - rasa_nama
    - rasa_stok
  BahanBaku:
    description: Bahan yang dipakai untuk membuat eskrim. Stoknya dihitung terpisah
      dari stok rasa.
    slots:
    - bahan_nama
    - bahan_stok
slots:
  toko_produksi_sendiri:
    slot_uri: uniti:toko_produksi_sendiri
    description: Apakah eskrim yang dijual dibuat di toko itu sendiri.
  rasa_nama:
    slot_uri: uniti:rasa_nama
    identifier: true
  rasa_stok:
    slot_uri: uniti:rasa_stok
    description: Berapa banyak eskrim rasa ini yang ada. Satuan belum ditanyakan.
  bahan_nama:
    slot_uri: uniti:bahan_nama
  bahan_stok:
    slot_uri: uniti:bahan_stok
    description: Berapa banyak bahan ini yang ada. Satuan belum ditanyakan.
