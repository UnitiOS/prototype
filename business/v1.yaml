id: https://uniti.example/business
name: business
version: v1
title: Ice cream inventory
description: What the shop holds, where it holds it, and what it made.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://uniti.example/business/
default_prefix: uniti
imports:
- linkml:types
default_range: string
classes:
  Freezer:
    description: A cabinet stock is held in.
    slots:
    - freezer_label
    - freezer_location
  Batch:
    description: One production run of one flavour.
    slots:
    - batch_code
    - batch_flavour
slots:
  freezer_label:
    slot_uri: uniti:freezer_label
    description: What the staff call this freezer.
  freezer_location:
    slot_uri: uniti:freezer_location
    description: Where in the shop it stands.
  batch_code:
    slot_uri: uniti:batch_code
    identifier: true
  batch_flavour:
    slot_uri: uniti:batch_flavour
annotations:
  valid_from: '2026-01-01T00:00:00+00:00'
  sealed_at: '2026-08-27T10:35:46.669726+00:00'
  supersedes: null
