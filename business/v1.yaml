id: https://uniti.example/business
name: marlow_gelato
version: v1
title: Marlow Gelato inventory
description: What a single-branch artisan gelato shop in north London holds, where
  it holds it, and how it moves. The shop adopts the system on 1 September 2025, and
  the facts stated here are the count taken the evening before.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://uniti.example/business/
default_prefix: uniti
imports:
- linkml:types
default_range: string
classes:
  Person:
    description: Someone who works in the shop. Marta does the buying and the books,
      Dan runs the batch freezer three mornings a week, and three part-time counter
      staff scoop, take payment, and write nothing down.
    slots:
    - person_name
  Supplier:
    description: One company the shop buys from. There are four, one of them for dairy.
    slots:
    - supplier_name
  Location:
    description: One place stock sits. The display cabinet is kept warmer than the
      freezers on purpose, so the gelato scoops properly.
    slots:
    - location_name
    - location_temperature
  Unit:
    description: 'What a quantity is counted in. Materials disagree about this: milk
      is in litres, sugar in kilograms, cones in pieces.'
    slots:
    - unit_name
  StockItem:
    description: Anything the shop holds and counts. A count goes through the materials
      in the dry store and the chiller and the pans in the freezers, and Marta calls
      all of it stock.
    slots:
    - stock_location
  Material:
    is_a: StockItem
    description: One purchasable input. Milk, cream, sugar, cocoa, cones, cups.
    slots:
    - material_name
    - material_quantity
    - material_unit
    - material_supplier
    - material_pack_size
    - material_pack_price
    - material_shelf_life_days
  Pan:
    is_a: StockItem
    description: One steel tray of finished gelato, holding about five litres. It
      hardens in the blast freezer for two hours, waits in the storage freezer, and
      goes to the display cabinet when the one on display runs out.
    slots:
    - pan_number
    - pan_flavour
    - pan_mix
    - pan_filled_kilograms
    - pan_pulled_kilograms
    - pan_filled_on
  Base:
    description: 'One of three mix formulas: a white dairy base, a chocolate dairy
      base, and a fruit sorbet base with no dairy in it.'
    slots:
    - base_name
    - base_ingredients
  Flavour:
    description: One entry in the recipe book. Sixteen exist and ten are on display,
      because the two best sellers take two pans each. Peach runs June to August and
      gingerbread runs in December only.
    slots:
    - flavour_name
    - flavour_base
    - flavour_scoop_price
    - flavour_in_rotation
    - flavour_pans_on_display
    - flavour_pans_in_storage
    - flavour_kilograms
  MixBatch:
    description: One 25-litre pasteurised batch, aged in the chiller for at least
      four hours before it is flavoured and run through the batch freezer. This is
      what Dan means by a batch. Marta means a delivery, and both of them say batch.
    slots:
    - mix_base
    - mix_made_by
    - mix_litres
    - mix_pasteurised_on
    unique_keys:
      batch_date_and_base:
        description: 'What the shop says identifies a batch: the date it was pasteurised
          and which of the three formulas it is. No single slot carries it, so both
          are required and neither is an identifier.'
        unique_key_slots:
        - mix_pasteurised_on
        - mix_base
  StockCount:
    description: One physical count of one location on one date. The last Sunday of
      the month after close, sometimes weekly, entered the same evening. It is the
      only moment the shop looks at its numbers and calls them settled.
    slots:
    - count_of
    - count_location
    - count_taken_on
    - count_quantity
    unique_keys:
      count_date_and_location:
        description: A count is the date it was taken and the place it was taken in.
          Two counts of one freezer on one evening are one count by this key, which
          is what makes them argue rather than sit side by side.
        unique_key_slots:
        - count_taken_on
        - count_location
  Sale:
    description: 'One day''s till total for one flavour. Not one transaction: the
      till exports a count of scoops per flavour per day, and the shop reads it the
      next morning.'
    slots:
    - sale_flavour
    - sale_date
    - sale_scoops
    unique_keys:
      sale_date_and_flavour:
        description: One day's till total for one flavour, which is the grain the
          till exports at and the grain the shop reads.
        unique_key_slots:
        - sale_date
        - sale_flavour
  StockMovement:
    description: Stock leaving one place, arriving in another, or leaving the shop
      altogether. Three of the ways stock moves here are never recorded by anybody,
      which is the reason the numbers argue.
    slots:
    - movement_of
    - movement_quantity
    - movement_out_of
    - movement_into
    - movement_happened_on
    - movement_recorded_by
  GoodsReceived:
    is_a: StockMovement
    description: A delivery from a supplier into the dry store or the chiller. Marta
      records it on the Friday, from the invoice, when the invoice is paid, so a Monday
      delivery is learned on the Friday. This is what Marta calls a batch.
    slots:
    - received_from
  PanMoved:
    is_a: StockMovement
    description: A pan going from the blast or storage freezer into the storage freezer
      or the display cabinet. Nobody records it and nobody ever has.
  PanPulled:
    is_a: StockMovement
    description: A pan coming out of display at roughly a fifth full, because it looks
      poor and the scoop drags. Nobody records it. What is left is given away as tastings
      over the next two days, taken home by staff, or thrown out, and which of the
      three happens is decided in the moment.
  ThrownOut:
    is_a: StockMovement
    description: Stock discarded. Marta records it when she remembers, which is days
      later or never.
  TastingGiven:
    is_a: StockMovement
    description: A scoop given away from the display cabinet. Nobody records it. Marta
      counts it as shrinkage and Dan does not.
  Policy:
    description: 'A rule the shop states about itself, in the words it states it in.
      None of them is written down anywhere in the shop and none of them is enforced
      here: a rule that stops a number being recorded is a derived rule, and this
      version has none. The shop identifies a rule by nothing, so this class declares
      no key.'
    slots:
    - policy_rule
    - policy_threshold
    - policy_unit
slots:
  person_name:
    slot_uri: uniti:person_name
    identifier: true
    range: string
    description: What the shop calls this person.
  supplier_name:
    slot_uri: uniti:supplier_name
    identifier: true
    range: string
    description: The company name, which is what identifies a supplier here.
  location_name:
    slot_uri: uniti:location_name
    identifier: true
    range: string
    description: What the staff call this place.
  location_temperature:
    slot_uri: uniti:location_temperature
    range: string
    description: How cold it is kept, stated the way the shop states it, which is
      a range for the freezers and the word ambient for the dry store.
  unit_name:
    slot_uri: uniti:unit_name
    identifier: true
    range: string
    description: litre, kg, or piece.
  stock_location:
    slot_uri: uniti:stock_location
    range: Location
    description: Where this sits. A pan sits in a freezer or in the cabinet; a material
      sits in the dry store or the chiller.
  material_name:
    slot_uri: uniti:material_name
    identifier: true
    range: string
    description: What the shop calls it, and what identifies it.
  material_quantity:
    slot_uri: uniti:material_quantity
    range: decimal
    description: 'How much of it is on hand. This slot names no unit, because materials
      do not agree on one: the unit is whatever material_unit says for this material.'
    annotations:
      stated_rule: stock should never go below zero, and if it does, something was
        recorded wrong
  material_unit:
    slot_uri: uniti:material_unit
    range: Unit
    description: What this material is measured in. It differs per material, so it
      is a thing a fact points at rather than a unit fixed on the slot.
  material_supplier:
    slot_uri: uniti:material_supplier
    range: Supplier
    description: Who it is bought from.
  material_pack_size:
    slot_uri: uniti:material_pack_size
    range: decimal
    description: How much arrives in one pack; a carton of cream is one litre. As
      with material_quantity, the unit is the material's own.
  material_pack_price:
    slot_uri: uniti:material_pack_price
    range: decimal
    unit:
      symbol: GBP
      descriptive_name: pounds
    description: What was paid for one pack, taken from the invoice.
  material_shelf_life_days:
    slot_uri: uniti:material_shelf_life_days
    range: integer
    unit:
      ucum_code: d
      descriptive_name: days
    description: How long it keeps once it has been opened. Dan knows these.
    annotations:
      stated_rule: fresh milk older than three days does not go into a base
  pan_number:
    slot_uri: uniti:pan_number
    range: string
    description: 'The number written on tape on the side of the tray. Not an identifier:
      numbers are reused, so the same number refers to different pans over time.'
  pan_flavour:
    slot_uri: uniti:pan_flavour
    range: Flavour
    description: Which flavour is in it.
  pan_mix:
    slot_uri: uniti:pan_mix
    range: MixBatch
    description: Which mix batch it was filled from.
  pan_filled_kilograms:
    slot_uri: uniti:pan_filled_kilograms
    range: decimal
    unit:
      ucum_code: kg
      descriptive_name: kilograms
    description: What it weighed when Dan filled it, from his paper log.
  pan_pulled_kilograms:
    slot_uri: uniti:pan_pulled_kilograms
    range: decimal
    unit:
      ucum_code: kg
      descriptive_name: kilograms
    description: What it weighed when it came out of display, from the same paper
      log. Dan reads shrinkage off this against what the till says was sold that week.
  pan_filled_on:
    slot_uri: uniti:pan_filled_on
    range: date
    description: The day it was filled, which is not the day the system learns it.
    annotations:
      stated_rule: a pan older than three weeks comes out of display, whatever is
        left in it
  base_name:
    slot_uri: uniti:base_name
    identifier: true
    range: string
    description: white, chocolate, or sorbet.
  base_ingredients:
    slot_uri: uniti:base_ingredients
    range: Material
    multivalued: true
    description: Which materials go into this base. A base mix is milk, cream, sugar,
      milk powder, dextrose and stabiliser, and that is said of a base mix in general
      — not of the white one, the chocolate one, or the sorbet, which has no dairy
      in it at all. No quantity is stated for any of them and the shop never says
      this relationship out loud, so the slot is here and no fact is.
  flavour_name:
    slot_uri: uniti:flavour_name
    identifier: true
    range: string
    description: What it is called on the menu board.
  flavour_base:
    slot_uri: uniti:flavour_base
    range: Base
    description: Which of the three mix formulas it is made from.
  flavour_scoop_price:
    slot_uri: uniti:flavour_scoop_price
    range: decimal
    unit:
      symbol: GBP
      descriptive_name: pounds
    description: What one scoop costs on the menu. Seasonal flavours cost more.
  flavour_in_rotation:
    slot_uri: uniti:flavour_in_rotation
    range: boolean
    description: Whether it is being made at the moment. Ten of the sixteen are; the
      others have a sticker over them on the menu board.
  flavour_pans_on_display:
    slot_uri: uniti:flavour_pans_on_display
    range: integer
    description: How many pans of it are in the display cabinet. This is what the
      counter staff mean when they say a flavour has run out, because the cabinet
      is all they can see.
    annotations:
      stated_rule: never fewer than eight flavours in the cabinet, or the display
        looks poor
  flavour_pans_in_storage:
    slot_uri: uniti:flavour_pans_in_storage
    range: integer
    description: How many pans of it are waiting in the storage freezer. When a counter
      staff member says the vanilla has run out, this is often two.
  flavour_kilograms:
    slot_uri: uniti:flavour_kilograms
    range: decimal
    unit:
      ucum_code: kg
      descriptive_name: kilograms
    description: How much of it there is in the whole shop, display and storage and
      anything still hardening. This is what Marta means when she says the vanilla.
    annotations:
      stated_rule: a flavour below five litres across the whole shop should be made
        again
  mix_base:
    slot_uri: uniti:mix_base
    required: true
    range: Base
    description: Which of the three formulas this batch is.
  mix_made_by:
    slot_uri: uniti:mix_made_by
    range: Person
    description: Who made it. In practice Dan, on Monday, Wednesday and Friday mornings.
  mix_litres:
    slot_uri: uniti:mix_litres
    range: decimal
    unit:
      ucum_code: L
      descriptive_name: litres
    description: How much was made. A batch is 25 litres. Four litres of mix comes
      out of the batch freezer as roughly five litres of gelato, and by how much more
      is not measured.
  mix_pasteurised_on:
    slot_uri: uniti:mix_pasteurised_on
    required: true
    range: date
    description: The day it was pasteurised, from Dan's paper log.
  count_of:
    slot_uri: uniti:count_of
    range: StockItem
    description: What was counted, which is a material or a pan. Both of them are
      stock, which is why they share a parent here.
  count_location:
    slot_uri: uniti:count_location
    required: true
    range: Location
    description: Where the count happened.
  count_taken_on:
    slot_uri: uniti:count_taken_on
    required: true
    range: date
    description: The day of the count, in the evening after close.
  count_quantity:
    slot_uri: uniti:count_quantity
    range: decimal
    description: How much was found. The unit is whatever the thing counted is measured
      in.
    annotations:
      stated_rule: shrinkage above five percent in a month means something is wrong
  sale_flavour:
    slot_uri: uniti:sale_flavour
    required: true
    range: Flavour
    description: Which flavour the day's total is for.
  sale_date:
    slot_uri: uniti:sale_date
    required: true
    range: date
    description: The day the till total covers. It is read the next morning.
  sale_scoops:
    slot_uri: uniti:sale_scoops
    range: integer
    description: How many scoops the till counted. A scoop is meant to be 80 grams,
      nobody weighs one, and what is served runs between 70 and 105.
  movement_of:
    slot_uri: uniti:movement_of
    range: StockItem
    description: What moved.
  movement_quantity:
    slot_uri: uniti:movement_quantity
    range: decimal
    description: How much moved, in whatever the thing that moved is measured in.
  movement_out_of:
    slot_uri: uniti:movement_out_of
    range: Location
    description: Where it left. A delivery leaves a supplier rather than a location.
  movement_into:
    slot_uri: uniti:movement_into
    range: Location
    description: Where it arrived. Nothing arrives anywhere when it is sold, thrown
      out or given away.
  movement_happened_on:
    slot_uri: uniti:movement_happened_on
    range: date
    description: The day it moved, which is not the day the system learns it. A pan
      filled on the Wednesday is learned on the Sunday.
  movement_recorded_by:
    slot_uri: uniti:movement_recorded_by
    range: Person
    description: Who wrote it down. For a pan moved, a pan pulled and a tasting given
      the honest answer is nobody, and it has always been nobody.
  received_from:
    slot_uri: uniti:received_from
    range: Supplier
    description: Who the delivery came from.
  policy_rule:
    slot_uri: uniti:policy_rule
    range: string
    description: The rule in the words Marta says it in, kept as a sentence rather
      than turned into a formula. How vaguely she says it is the thing worth keeping.
  policy_threshold:
    slot_uri: uniti:policy_threshold
    range: decimal
    description: 'The number the rule turns on, where the rule gives one. This slot
      fixes no unit: the rules disagree about theirs, and one of them names none anybody
      can act on.'
  policy_unit:
    slot_uri: uniti:policy_unit
    range: Unit
    description: What the threshold is counted in. Days for a shelf life, weeks for
      a pan on display, percent for shrinkage — so it is a thing a fact points at
      rather than a unit fixed on the slot. A rule that names no unit carries no fact
      here.
annotations:
  valid_from: '2025-09-01T00:00:00+00:00'
  sealed_at: '2025-08-31T21:00:00+00:00'
  supersedes: null
  transcript: v1.txt
