id: https://uniti.example/sorella_demo
name: sorella_gelato_demo
version: v5
title: Sorella Gelato — what the kitchen holds
description: 'One corner of Sorella Gelato: the things the kitchen buys, the places
  they sit in, the three pieces of paper that say what came in, what went out and
  what was found on the shelf, and the two totals a person reads off them.

  It is Sorella narrowed and not Sorella changed. Every slot that means what a slot
  of business/sorella/v3.yaml means carries that slot''s own `slot_uri` under the
  `sorella:` prefix, because a slot''s identity is its URI: the same fact stated here
  and there is a fact under one predicate. Only the count total, which v3 has no class
  for, declares URIs of its own.

  Twelve classes. Nine of them are what the business is and three are what it writes:
  a movement, a count sheet and a line on one. Two more are computed and stated by
  nobody — what the movements say is standing, and what the count sheets found — and
  they are deliberately two tables rather than one subtraction, because they answer
  different questions and the reader takes the difference.

  It states vocabulary only. Not one fact is here: the eight things, the eight places,
  the five ways stock moves, the three people, the movements and the count sheets
  are rows a generated form writes.'
prefixes:
  linkml: https://w3id.org/linkml/
  sorella: https://uniti.example/sorella/
  sorella_demo: https://uniti.example/sorella_demo/
default_prefix: sorella_demo
imports:
- linkml:types
default_range: string
classes:
  Location:
    description: 'One place a thing can be. The plain case is a place that is not
      inside the business and is not a supplier either: the kitchen bin, staff, and
      tastings. Nothing is counted at one of them; they are where stock stops being
      the business''s, and they are places for exactly that reason.'
    slots:
    - entity_class
    - location_name
    - location_description
  InternalLocation:
    is_a: Location
    description: 'A place inside the business. Two of them here: the dry store, which
      is ambient, and the walk-in chiller, which is kept between two and four degrees.
      These are the ones that hold a stock anybody counts.'
    slots:
    - location_temperature
  Supplier:
    is_a: Location
    description: 'One company the business buys from, and a place before it is anything
      else: the milk is the dairy''s until the driver puts it in the chiller, so a
      delivery is a movement out of the dairy and into the chiller and the two ends
      are the same kind of thing.'
    slots:
    - outside_where
    - supplier_brings
    - supplier_rhythm
    - supplier_lead_time
  Person:
    description: 'Someone who works in the business and puts their name on a document.
      A name and a job written as a phrase, and nothing else: what the paper carries
      is all anybody has.'
    slots:
    - entity_class
    - person_name
    - person_role
  Unit:
    description: What a quantity is counted in, and a thing in its own right rather
      than a word typed into a box. A bag of milk is ten litres and a bag of cocoa
      is five kilograms, so the word alone does not say how much and the meaning is
      carried beside it.
    slots:
    - entity_class
    - unit_name
    - unit_meaning
  Ingredient:
    description: One thing the kitchen buys and counts. Its name is what the staff
      call it and what identifies it; beside that it carries who it is bought from,
      what one pack costs as it arrives, what a count of it is written in, and the
      level at which it is reordered where anybody has stated one.
    slots:
    - entity_class
    - item_name
    - item_base_unit
    - item_counted_in
    - item_supplier
    - item_pack_price
    - item_price_per_kg
    - item_reorder_level
    - item_note
  UnitConversion:
    description: A factor that converts a quantity in one packaging unit of an ingredient
      to the standard base unit (kg).
    slots:
    - entity_class
    - conversion_ingredient
    - conversion_unit
    - conversion_factor
  MovementKind:
    description: 'One of the ways stock moves, written once rather than retyped on
      every document: what it is called, what actually happens, and what gets filled
      in on paper. Which of them a particular movement was is a field on the movement.'
    slots:
    - entity_class
    - kind_name
    - kind_happens
    - kind_document
  StockMovement:
    description: 'One thing moving from one place to another, once. A delivery adds
      and a bin subtracts and nothing has to say so: the direction falls out of the
      two ends, because a supplier is a place and a bin is a place and the movement
      names both.

      Almost everything on it is optional. Somebody weighs the bin without noting
      what was in it, a tin is opened for a tasting and nobody writes who did it,
      and a system that refuses the line is a system they stop using.'
    slots:
    - entity_class
    - movement_kind
    - movement_out_of
    - movement_into
    - movement_ingredient
    - movement_quantity
    - movement_unit
    - happened_on
    - written_by
    - movement_note
  StockCount:
    description: 'One count sheet: a blank ruled sheet, monthly, with a date at the
      head and who counted. It has no number on it and nothing in the business identifies
      one, so it carries no key — two counts of one store on one day are two counts,
      and a disagreement between them is a fact rather than a tie to be broken.'
    slots:
    - entity_class
    - happened_on
    - written_by
    - count_note
  StockCountLine:
    description: 'One line on a count sheet: the sheet it is on, the item as it was
      written, the thing that resolves to, where the counter was standing, the number
      and the unit. The paper has no column for where, and the count runs through
      the building, so it is asked for here although the sheet never asks.'
    slots:
    - entity_class
    - line_count
    - count_line_written_as
    - count_line_ingredient
    - count_line_where
    - count_line_quantity
    - count_line_unit
    - count_line_note
  IngredientOnHand:
    description: 'What arrived and what left, per thing and per place in standard
      base unit (kg). Nobody states a row of this: every value on it is computed from
      the movements at a stated pair of clocks, converted into kilograms.'
    slots:
    - ingredient_on_hand
    - ingredient_where
    - ingredient_unit
    - ingredient_in
    - ingredient_out
    - ingredient_on_hand_net
    - ingredient_reorder_level
    - ingredient_pack_price
    - ingredient_price_per_kg
    - ingredient_stock_value
  CountedOnHand:
    description: 'What the count sheets found, per thing and per place in standard
      base unit (kg): totalled off the count lines and converted to kilograms.'
    slots:
    - counted_ingredient
    - counted_where
    - counted_unit
    - counted_quantity
  StockReconciliation:
    description: 'Stock variance and reconciliation: what movements say should be
      standing (expected), what the count sheets actually found (counted), the variance
      in kilograms, and the financial value of the variance (£).'
    slots:
    - reconciliation_ingredient
    - reconciliation_where
    - reconciliation_unit
    - reconciliation_price_per_kg
    - reconciliation_reorder_level
    - reconciliation_in
    - reconciliation_out
    - reconciliation_expected
    - reconciliation_counted
    - reconciliation_stock_value
    - reconciliation_variance
    - reconciliation_variance_value
slots:
  entity_class:
    title: Class
    slot_uri: sorella:entity_class
    designates_type: true
    range: string
    description: Which class this entity is an instance of. Stated as a fact with
      both clocks, never guessed from which columns happen to be filled.
  location_name:
    title: Place
    slot_uri: sorella:location_name
    identifier: true
    range: string
    description: What the staff call this place, and what identifies it.
  location_description:
    title: What it is
    slot_uri: sorella:location_description
    range: string
    description: What it is, in the words the business uses. For a store that is what
      goes in it; for an outside place it is usually where ownership passes.
  location_temperature:
    title: Kept at
    slot_uri: sorella:location_temperature
    range: string
    description: How cold it is kept, stated the way the business states it, which
      is a range of two numbers for the chiller and the word ambient for the dry store.
  outside_where:
    title: Where they are
    slot_uri: sorella:outside_where
    range: string
    description: The town or county it is in. Coarser than an address, and that is
      all anybody says.
  supplier_brings:
    title: Brings
    slot_uri: sorella:supplier_brings
    range: string
    description: What this supplier brings, in one phrase rather than a list of items,
      because that is how the business says it and because the items already name
      their own supplier.
  supplier_rhythm:
    title: Comes
    slot_uri: sorella:supplier_rhythm
    range: string
    description: How often they come, and on which days.
  supplier_lead_time:
    title: Lead time
    slot_uri: sorella:supplier_lead_time
    range: string
    description: How long between ordering and arriving, in the sentence the business
      uses rather than as a number of days.
  person_name:
    title: Name
    slot_uri: sorella:person_name
    identifier: true
    range: string
    description: What the business calls this person, and what identifies them.
  person_role:
    title: Job
    slot_uri: sorella:person_role
    range: string
    description: Their job, as the business writes it, which is a phrase and sometimes
      carries the hours.
  unit_name:
    title: Unit
    slot_uri: sorella:unit_name
    identifier: true
    range: string
    description: The word — bag, can, sack, tin, carton, kilo. The word alone often
      does not say how much.
  unit_meaning:
    title: What it means
    slot_uri: sorella:unit_meaning
    range: string
    description: What the word means in this business, which is the only thing that
      disambiguates it.
  item_name:
    title: Thing
    slot_uri: sorella:item_name
    identifier: true
    range: string
    description: What the business calls it, and what identifies it. Nobody says item
      4471; they say the dextrose.
  item_counted_in:
    title: Counted in
    slot_uri: sorella:item_counted_in
    range: Unit
    description: What a count of it is written in. It is a thing a fact points at
      rather than a unit fixed on this slot, because items disagree about which unit
      they are counted in and the same word means different amounts.
  item_supplier:
    title: Bought from
    slot_uri: sorella:item_supplier
    range: Supplier
    description: Who it is bought from.
  item_pack_price:
    title: Price a pack
    slot_uri: sorella:item_pack_price
    range: decimal
    description: What one pack costs as it arrives. It has a history — the pistachio
      paste has been three prices in two years — and the history is the log's, not
      this slot's.
  item_reorder_level:
    title: Reorder at
    slot_uri: sorella:item_reorder_level
    range: decimal
    description: The level at which this thing is reordered, in what it is counted
      in. Three of the eight have one; the other five have nothing written down, which
      is not a level of nought.
  item_note:
    title: Note
    slot_uri: sorella:item_note
    range: string
    description: What the business says about this thing's units — that a carton is
      ten bags, that a bag is volume and a recipe is mass.
  item_base_unit:
    title: Base unit
    slot_uri: sorella:item_base_unit
    range: Unit
    description: The standard base unit the business measures this item in (kg).
  item_price_per_kg:
    title: Price / kg
    slot_uri: sorella:item_price_per_kg
    range: decimal
    description: Standard cost per kilogram of this ingredient.
  conversion_ingredient:
    title: Ingredient
    slot_uri: sorella:conversion_ingredient
    range: Ingredient
    description: Which ingredient this conversion factor applies to.
  conversion_unit:
    title: Unit
    slot_uri: sorella:conversion_unit
    range: Unit
    description: The packaging unit being converted from.
  conversion_factor:
    title: Factor
    slot_uri: sorella:conversion_factor
    range: decimal
    description: Number of standard base units (kg) per unit of this ingredient.
  kind_name:
    title: Kind of movement
    slot_uri: sorella:kind_name
    identifier: true
    range: string
    description: What the staff call this way of moving stock, and what identifies
      it.
  kind_happens:
    title: What happens
    slot_uri: sorella:kind_happens
    range: string
    description: What actually happens, in the business's own words. It is the only
      place the act is described rather than the paper.
  kind_document:
    title: On paper
    slot_uri: sorella:kind_document
    range: string
    description: What gets filled in and by whom. For two of the five the answer is
      that nothing is written down, and the word is recorded rather than repaired.
  movement_kind:
    title: Kind
    slot_uri: sorella:movement_kind
    range: MovementKind
    description: 'Which of the five ways this movement was. The kind lives here rather
      than in a class per kind: five movement classes would be five forms differing
      in nothing but a word.'
  movement_out_of:
    title: Out of
    slot_uri: sorella:movement_out_of
    range: Location
    description: Where it came from, drawn from the same list of places whether the
      place is inside the business or outside it.
  movement_into:
    title: Into
    slot_uri: sorella:movement_into
    range: Location
    description: 'Where it went. The outside destinations are places too: the bin,
      staff, a tasting.'
  movement_ingredient:
    title: Thing
    slot_uri: sorella:movement_ingredient
    range: Ingredient
    description: Which thing moved, where the movement is of one. Empty when the bin
      was weighed and nobody wrote down what was in it.
  movement_quantity:
    title: How many
    slot_uri: sorella:movement_quantity
    range: decimal
    description: How many, or how much. Empty whenever the business did not write
      one down.
  movement_unit:
    title: Written in
    slot_uri: sorella:movement_unit
    range: Unit
    description: What the number on this line is in. Not always what the thing is
      counted in — a bin bag is weighed whatever the thing arrived as.
  happened_on:
    title: Dated
    slot_uri: sorella:happened_on
    range: date
    description: 'The date written on the paper. A person fills it in, which is why
      it is a slot: it is what the document says about the world, not when the log
      learned it.'
  written_by:
    title: Written by
    slot_uri: sorella:written_by
    range: Person
    description: Who put their name on it. Often nobody did, and a required one would
      assert that somebody was there.
  movement_note:
    title: Note
    slot_uri: sorella:movement_note
    range: string
    description: Anything written in words rather than in a column.
  count_note:
    title: Notes at the foot
    slot_uri: sorella:count_note
    range: string
    description: The notes at the foot of the count sheet, in sentences. It is where
      a counter writes what a column could not hold.
  line_count:
    title: On sheet
    slot_uri: sorella:line_count
    range: StockCount
    description: Which sheet this line is on.
  count_line_written_as:
    title: Written as
    slot_uri: sorella:count_line_written_as
    range: string
    description: The cell as it stands on the paper, because the item is written as
      it is found and not read off a list.
  count_line_ingredient:
    title: Thing
    slot_uri: sorella:count_line_ingredient
    range: Ingredient
    description: Which thing the line is about, where the cell resolves to one.
  count_line_where:
    title: Counted at
    slot_uri: sorella:count_line_where
    range: Location
    description: Where the line was counted. The sheet has no column for it and the
      count runs through the building.
  count_line_quantity:
    title: Counted
    slot_uri: sorella:count_line_quantity
    range: decimal
    description: The counted column. It can be a number of sealed packs or a fraction
      of one read off by eye.
  count_line_unit:
    title: Written in
    slot_uri: sorella:count_line_unit
    range: Unit
    description: What the number is in, where the cell says. The same mismatch as
      everywhere else — cartons and bags of one thing on one sheet.
  count_line_note:
    title: Note
    slot_uri: sorella:count_line_note
    range: string
    description: What is written beside the number — one broken into, part used —
      and, where a line was struck through, that it was.
  ingredient_on_hand:
    title: Thing
    slot_uri: sorella:ingredient_on_hand
    range: Ingredient
    description: The thing a row is about. A dimension of a computed group, never
      stated.
  ingredient_where:
    title: Place
    slot_uri: sorella:ingredient_where
    range: Location
    description: The place a row is about. A dimension of a computed group, never
      stated.
  ingredient_unit:
    title: Unit
    slot_uri: sorella:ingredient_unit
    range: Unit
    annotations:
      parameter:
        value:
          of: ingredient_on_hand
          slot: item_base_unit
    description: The standard base unit the balance is stated in (kg).
  ingredient_in:
    title: Arrived (kg)
    slot_uri: sorella:ingredient_in
    range: decimal
    description: Everything of this thing that arrived at this place, summed over
      the movements in standard base units (kg) at whatever pair of clocks the question
      is asked at. Computed, never stated.
    annotations:
      aggregate:
        value:
          over: StockMovement
          sum: movement_quantity
          by:
            ingredient_on_hand: movement_ingredient
            ingredient_where: movement_into
          where:
            movement_into:
              is_a: InternalLocation
            movement_ingredient:
              is_a: Ingredient
          convert:
            using: UnitConversion
            true:
              conversion_ingredient: movement_ingredient
              conversion_unit: movement_unit
            factor: conversion_factor
  ingredient_out:
    title: Left (kg)
    slot_uri: sorella:ingredient_out
    range: decimal
    description: Everything of this thing that left this place, summed over the same
      movements in standard base units (kg) as ingredient_in.
    annotations:
      aggregate:
        value:
          over: StockMovement
          sum: movement_quantity
          by:
            ingredient_on_hand: movement_ingredient
            ingredient_where: movement_out_of
          where:
            movement_out_of:
              is_a: InternalLocation
            movement_ingredient:
              is_a: Ingredient
          convert:
            using: UnitConversion
            true:
              conversion_ingredient: movement_ingredient
              conversion_unit: movement_unit
            factor: conversion_factor
  ingredient_on_hand_net:
    title: Standing (kg)
    slot_uri: sorella:ingredient_on_hand_net
    range: decimal
    equals_expression: '{ingredient_in} - {ingredient_out}'
    description: 'What is standing at this place, of this thing, in standard kilograms:
      everything that arrived less everything that left, scoped to internal storage
      locations.'
  ingredient_reorder_level:
    title: Reorder at
    slot_uri: sorella:ingredient_reorder_level
    range: decimal
    annotations:
      parameter:
        value:
          of: ingredient_on_hand
          slot: item_reorder_level
    description: The level stated for the thing this row is about, read off the log
      at the same pair of clocks as everything beside it. Where nothing is stated
      it is empty rather than nought.
  ingredient_pack_price:
    title: Price a pack
    slot_uri: sorella:ingredient_pack_price
    range: decimal
    annotations:
      parameter:
        value:
          of: ingredient_on_hand
          slot: item_pack_price
    description: The price per pack of the thing this row is about, read off the log
      the same way the level is.
  ingredient_price_per_kg:
    title: Price / kg
    slot_uri: sorella:ingredient_price_per_kg
    range: decimal
    annotations:
      parameter:
        value:
          of: ingredient_on_hand
          slot: item_price_per_kg
    description: The standard price per kilogram of the thing this row is about.
  ingredient_stock_value:
    title: Stock Value (£)
    slot_uri: sorella:ingredient_stock_value
    range: decimal
    equals_expression: '{ingredient_on_hand_net} * {ingredient_price_per_kg}'
    description: What is standing here in kg, multiplied by standard price per kg.
  counted_ingredient:
    title: Thing
    slot_uri: sorella_demo:counted_ingredient
    range: Ingredient
    description: The thing a row of CountedOnHand is about. A dimension of a computed
      group, never stated.
  counted_where:
    title: Counted at
    slot_uri: sorella_demo:counted_where
    range: Location
    description: The place a row of CountedOnHand is about, which is where the counter
      was standing when the line was written.
  counted_unit:
    title: Unit
    slot_uri: sorella_demo:counted_unit
    range: Unit
    annotations:
      parameter:
        value:
          of: counted_ingredient
          slot: item_base_unit
    description: The standard base unit the count is stated in (kg).
  counted_quantity:
    title: Counted (kg)
    slot_uri: sorella_demo:counted_quantity
    range: decimal
    description: Everything the count sheets found of this thing, at this place, converted
      to standard kilograms.
    annotations:
      aggregate:
        value:
          over: StockCountLine
          sum: count_line_quantity
          by:
            counted_ingredient: count_line_ingredient
            counted_where: count_line_where
          where:
            count_line_where:
              is_a: InternalLocation
            count_line_ingredient:
              is_a: Ingredient
          convert:
            using: UnitConversion
            true:
              conversion_ingredient: count_line_ingredient
              conversion_unit: count_line_unit
            factor: conversion_factor
  reconciliation_ingredient:
    title: Thing
    slot_uri: sorella_demo:reconciliation_ingredient
    range: Ingredient
    description: The thing a row of StockReconciliation is about. A dimension of a
      computed group, never stated.
  reconciliation_where:
    title: Place
    slot_uri: sorella_demo:reconciliation_where
    range: Location
    description: The place a row of StockReconciliation is about, scoped to internal
      storage locations.
  reconciliation_unit:
    title: Unit
    slot_uri: sorella_demo:reconciliation_unit
    range: Unit
    annotations:
      parameter:
        value:
          of: reconciliation_ingredient
          slot: item_base_unit
    description: The standard base unit the reconciliation is stated in (kg).
  reconciliation_price_per_kg:
    title: Price / kg
    slot_uri: sorella_demo:reconciliation_price_per_kg
    range: decimal
    annotations:
      parameter:
        value:
          of: reconciliation_ingredient
          slot: item_price_per_kg
    description: Standard price per kilogram (£).
  reconciliation_reorder_level:
    title: Reorder at
    slot_uri: sorella_demo:reconciliation_reorder_level
    range: decimal
    annotations:
      parameter:
        value:
          of: reconciliation_ingredient
          slot: item_reorder_level
    description: Threshold quantity in base units (kg) where reorder is triggered.
  reconciliation_in:
    title: Arrived (kg)
    slot_uri: sorella_demo:reconciliation_in
    range: decimal
    description: Total arrivals of this thing into this internal location in kilograms.
    annotations:
      aggregate:
        value:
          over: StockMovement
          sum: movement_quantity
          by:
            reconciliation_ingredient: movement_ingredient
            reconciliation_where: movement_into
          where:
            movement_into:
              is_a: InternalLocation
            movement_ingredient:
              is_a: Ingredient
          convert:
            using: UnitConversion
            'on':
              conversion_ingredient: movement_ingredient
              conversion_unit: movement_unit
            factor: conversion_factor
  reconciliation_out:
    title: Left (kg)
    slot_uri: sorella_demo:reconciliation_out
    range: decimal
    description: Total movements out of this internal location in kilograms.
    annotations:
      aggregate:
        value:
          over: StockMovement
          sum: movement_quantity
          by:
            reconciliation_ingredient: movement_ingredient
            reconciliation_where: movement_out_of
          where:
            movement_out_of:
              is_a: InternalLocation
            movement_ingredient:
              is_a: Ingredient
          convert:
            using: UnitConversion
            'on':
              conversion_ingredient: movement_ingredient
              conversion_unit: movement_unit
            factor: conversion_factor
  reconciliation_expected:
    title: Expected (kg)
    slot_uri: sorella_demo:reconciliation_expected
    range: decimal
    equals_expression: '{reconciliation_in} - {reconciliation_out}'
    description: Expected stock standing at this location according to recorded movements
      (in - out).
  reconciliation_counted:
    title: Counted (kg)
    slot_uri: sorella_demo:reconciliation_counted
    range: decimal
    description: Physical count of this thing at this location in standard kilograms.
    annotations:
      aggregate:
        value:
          over: StockCountLine
          sum: count_line_quantity
          by:
            reconciliation_ingredient: count_line_ingredient
            reconciliation_where: count_line_where
          where:
            count_line_where:
              is_a: InternalLocation
            count_line_ingredient:
              is_a: Ingredient
          convert:
            using: UnitConversion
            'on':
              conversion_ingredient: count_line_ingredient
              conversion_unit: count_line_unit
            factor: conversion_factor
  reconciliation_stock_value:
    title: Stock Value (£)
    slot_uri: sorella_demo:reconciliation_stock_value
    range: decimal
    equals_expression: '{reconciliation_counted} * {reconciliation_price_per_kg}'
    description: Physical stock valuation in pounds sterling (£).
  reconciliation_variance:
    title: Variance (kg)
    slot_uri: sorella_demo:reconciliation_variance
    range: decimal
    equals_expression: '{reconciliation_counted} - {reconciliation_expected}'
    description: Difference between physical count and expected stock in kilograms
      (counted - expected).
  reconciliation_variance_value:
    title: Variance (£)
