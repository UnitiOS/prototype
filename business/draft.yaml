    # ---- The six rules the shop states (section 10) ------------------------
    # Sentences, in Marta's wording, on six subjects of their own. Nothing
    # enforces them and nothing computes from them: a rule that stops a number
    # being recorded is a derived rule, and this version has none. A threshold
    # is attached where she gives a number, which is all six of them, and a unit
    # only where the rule names one the profile does not then take back. They
    # take effect 2025-09-01 like every other fact here, which is what lets her
    # move a threshold later without last month's report moving with it.

    # No unit: stock is measured in whatever each material is measured in, and
    # section 5 says so rather than naming one for this rule.
    - subject: uniti:rule_stock_never_negative
      predicate: uniti:policy_rule
      value: Stock should never go below zero. If it does, something was recorded wrong.
    - subject: uniti:rule_stock_never_negative
      predicate: uniti:policy_threshold
      value: 0

    # The rule says litres and section 12 says nobody has ever stated which
    # litres — of mix, or of finished gelato — and that it has been applied both
    # ways. Recording uniti:litre here would settle that on the shop's behalf,
    # so the threshold stands alone.
    - subject: uniti:rule_flavour_below_five_litres
      predicate: uniti:policy_rule
      value: A flavour below five litres across the whole shop should be made again.
    - subject: uniti:rule_flavour_below_five_litres
      predicate: uniti:policy_threshold
      value: 5

    - subject: uniti:rule_milk_older_than_three_days
      predicate: uniti:policy_rule
      value: Fresh milk older than three days does not go into a base.
    - subject: uniti:rule_milk_older_than_three_days
      predicate: uniti:policy_threshold
      value: 3
    - subject: uniti:rule_milk_older_than_three_days
      predicate: uniti:policy_unit
      value: uniti:day

    - subject: uniti:rule_pan_older_than_three_weeks
      predicate: uniti:policy_rule
      value: A pan older than three weeks comes out of display, whatever is left in it.
    - subject: uniti:rule_pan_older_than_three_weeks
      predicate: uniti:policy_threshold
      value: 3
    - subject: uniti:rule_pan_older_than_three_weeks
      predicate: uniti:policy_unit
      value: uniti:week

    # No unit: eight flavours is a count of things this map already holds, and
    # the map counts things without a unit elsewhere — flavour_pans_on_display
    # and sale_scoops are both bare integers.
    - subject: uniti:rule_eight_flavours_in_the_cabinet
      predicate: uniti:policy_rule
      value: Never fewer than eight flavours in the cabinet, or the display looks poor.
    - subject: uniti:rule_eight_flavours_in_the_cabinet
      predicate: uniti:policy_threshold
      value: 8

    # The number the whole shop argues about. What shrinkage is stays out of
    # this version — section 11 computes it two ways and neither is written
    # down — so what is recorded is the threshold and not the arithmetic.
    - subject: uniti:rule_shrinkage_above_five_percent
      predicate: uniti:policy_rule
      value: Shrinkage above five percent in a month means something is wrong.
    - subject: uniti:rule_shrinkage_above_five_percent
      predicate: uniti:policy_threshold
      value: 5
    - subject: uniti:rule_shrinkage_above_five_percent
      predicate: uniti:policy_unit
      value: uniti:percent
