id: https://uniti.example/business
name: business
title: Usaha eskrim — toko dengan produksi sendiri
description: Toko eskrim yang juga memproduksi di tempat yang sama. Fokus sesi ini
  adalah persediaan.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://uniti.example/business/
default_prefix: uniti
imports:
  - linkml:types
default_range: string
classes:
  Toko:
    description: Tempat usaha. Orang datang ke sini, dan eskrimnya dibuat di sini juga.
    slots:
      - toko_produksi_sendiri
  Rasa:
    description: Satu rasa eskrim. Stok dihitung per rasa.
    slots:
      - rasa_nama
      - rasa_stok
  BahanBaku:
    description: Bahan yang dipakai untuk membuat eskrim. Stoknya dihitung terpisah
      dari stok rasa.
