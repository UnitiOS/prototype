id: https://uniti.example/business
name: business
title: Generator fixture
description: A business small enough that a generated table can be checked by eye.
  Everything it declares is namespaced g_ so that sealing it leaves the other
  suites' entities alone — the URI registry is global.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://uniti.example/business/
default_prefix: uniti
imports:
  - linkml:types
default_range: string
classes:
  Held:
    description: Anything the business holds and can say where it is.
    slots:
      - g_class
      - g_place
  Parcel:
    is_a: Held
    description: One parcel. Inherits g_place, which is what makes the
      bundle turn up in this table.
    slots:
      - g_parcel_name
      - g_parcel_weight
      - g_parcel_variant
  Variant:
    description: One entry in the recipe book.
    slots:
      - g_class
      - g_variant_name
  Rumour:
    description: A class the business declares and never states one fact about.
    slots:
      - g_class
      - g_rumour_text
  Tally:
    description: A class nothing is ever an instance of, because it is counted
      up rather than written down. It carries no slot designating a class,
      which is what makes it a table and not a form.
    slots:
      - g_tally_total
slots:
  g_class:
    slot_uri: uniti:g_class
    designates_type: true
    range: string
    description: Which class this entity is an instance of. Stated, never
      inferred from which columns happen to be filled.
  g_place:
    slot_uri: uniti:g_place
    range: string
    description: Where it stands.
  g_parcel_name:
    slot_uri: uniti:g_parcel_name
    identifier: true
    range: string
    description: What is written on the tape.
  g_parcel_weight:
    slot_uri: uniti:g_parcel_weight
    required: true
    range: decimal
    description: What it weighed when it was filled.
  g_parcel_variant:
    slot_uri: uniti:g_parcel_variant
    range: Variant
    description: Which variant is in it.
  g_variant_name:
    slot_uri: uniti:g_variant_name
    identifier: true
    range: string
    description: What it is called on the board.
  g_rumour_text:
    slot_uri: uniti:g_rumour_text
    range: string
    description: Something someone said.
  g_tally_total:
    slot_uri: uniti:g_tally_total
    range: decimal
    description: A number nobody writes down.
annotations:
  transcript: draft_fixture.txt
  valid_from: '2026-01-01T00:00:00Z'
  facts:
    - subject: uniti:g_plain
      predicate: uniti:g_class
      value: Variant
    - subject: uniti:g_plain
      predicate: uniti:g_variant_name
      value: Plain
    - subject: uniti:g_parcel_1
      predicate: uniti:g_class
      value: Parcel
    - subject: uniti:g_parcel_1
      predicate: uniti:g_parcel_name
      value: Parcel 1
    - subject: uniti:g_parcel_1
      predicate: uniti:g_parcel_weight
      value: '4.8'
    - subject: uniti:g_parcel_1
      predicate: uniti:g_parcel_variant
      value: uniti:g_plain
    - subject: uniti:g_parcel_1
      predicate: uniti:g_place
      value: Front shelf
    - subject: uniti:g_parcel_2
      predicate: uniti:g_class
      value: Parcel
    - subject: uniti:g_parcel_2
      predicate: uniti:g_parcel_name
      value: Parcel 2
    - subject: uniti:g_bundle
      predicate: uniti:g_class
      value: Held
    - subject: uniti:g_bundle
      predicate: uniti:g_place
      value: Back shelf
