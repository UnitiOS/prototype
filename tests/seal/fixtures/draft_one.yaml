id: https://uniti.example/business
name: business
title: Fixture inventory
description: What the business holds, where it holds it, and what it made.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://uniti.example/business/
default_prefix: uniti
imports:
  - linkml:types
default_range: string
classes:
  Box:
    description: A container things are held in.
    slots:
      - box_label
      - box_location
  Run:
    description: One run of one variant.
    slots:
      - run_code
      - run_variant
slots:
  box_label:
    slot_uri: uniti:box_label
    description: What this box is called.
  box_location:
    slot_uri: uniti:box_location
    description: Where it stands.
  run_code:
    slot_uri: uniti:run_code
    identifier: true
  run_variant:
    slot_uri: uniti:run_variant
annotations:
  transcript: draft_one.txt
  valid_from: '2026-01-01T00:00:00Z'
  facts:
    - subject: uniti:box_a
      predicate: uniti:box_label
      value: Box A
    - subject: uniti:box_a
      predicate: uniti:box_location
      value: Front room
    - subject: uniti:box_b
      predicate: uniti:box_label
      value: Box B
