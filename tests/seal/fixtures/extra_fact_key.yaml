id: https://uniti.example/business
name: business
title: Fixture inventory, with a fifth key on a fact
description: Two opening quantities, one weighed and one eyeballed.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://uniti.example/business/
default_prefix: uniti
imports:
  - linkml:types
default_range: string
classes:
  Supply:
    description: A thing the business holds an amount of.
    slots:
      - supply_label
      - supply_amount
slots:
  supply_label:
    slot_uri: uniti:supply_label
    description: What it is called.
  supply_amount:
    slot_uri: uniti:supply_amount
    description: How much of it there was.
annotations:
  transcript: draft_confidence.txt
  valid_from: '2026-07-01T00:00:00Z'
  facts:
    # Measured.
    - subject: uniti:supply_a
      predicate: uniti:supply_amount
      value: 24.0
      confidence: high
    # Estimated.
    - subject: uniti:supply_b
      predicate: uniti:supply_amount
      value: 3
      confidence: low
      authority: person_a
    # Says nothing about how sure it is, so the log says nothing either.
    - subject: uniti:supply_a
      predicate: uniti:supply_label
      value: Supply A
