id: https://uniti.example/business
name: business
title: Fixture inventory, with one relationship
description: A run is stored in a box. That slot's range is a class.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://uniti.example/business/
default_prefix: uniti
imports:
  - linkml:types
default_range: string
classes:
  Box:
    description: A container things are held in.
    slots:
      - box_label
  Run:
    description: One run of one variant.
    slots:
      - run_variant
      - run_volume
      - stored_in
slots:
  box_label:
    slot_uri: uniti:box_label
    description: What this box is called.
  run_variant:
    slot_uri: uniti:run_variant
    description: No range, so default_range applies. A literal.
  run_volume:
    slot_uri: uniti:run_volume
    range: decimal
    description: A type range. Still a literal.
  stored_in:
    slot_uri: uniti:stored_in
    range: Box
    description: A class range. The value names an entity, not a string.
annotations:
  transcript: draft_ranges.txt
  valid_from: '2026-05-01T00:00:00Z'
  facts:
    - subject: uniti:box_d
      predicate: uniti:box_label
      value: Box D
    - subject: uniti:run_71
      predicate: uniti:run_variant
      value: Speckled
    - subject: uniti:run_71
      predicate: uniti:run_volume
      value: 18.5
    # Two runs into the same box, and one of them into a box this
    # draft never names as a subject.
    - subject: uniti:run_71
      predicate: uniti:stored_in
      value: uniti:box_d
    - subject: uniti:run_72
      predicate: uniti:stored_in
      value: uniti:box_d
    - subject: uniti:run_72
      predicate: uniti:stored_in
      value: uniti:box_e
