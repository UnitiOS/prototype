id: https://uniti.example/business
name: business
title: Fixture inventory
description: A second pass. One slot is renamed and one is new.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://uniti.example/business/
default_prefix: uniti
imports:
  - linkml:types
default_range: string
classes:
  Box:
    description: A container things are held in.
    slots:
      - box_label
      - box_place
  Run:
    description: One run of one variant.
    slots:
      - run_code
      - run_variant
      - run_volume
slots:
  box_label:
    slot_uri: uniti:box_label
    description: What this box is called.
  box_place:
    slot_uri: uniti:box_location
    description: Renamed from box_location. The slot_uri does not move.
  run_code:
    slot_uri: uniti:run_code
    identifier: true
  run_variant:
    slot_uri: uniti:run_variant
  run_volume:
    slot_uri: uniti:run_volume
    description: How much came out of the run.
annotations:
  transcript: draft_two.txt
  valid_from: '2026-02-01T00:00:00Z'
  facts:
    - subject: uniti:box_a
      predicate: uniti:box_label
      value: Box A
    - subject: uniti:box_c
      predicate: uniti:box_label
      value: Box C
    - subject: uniti:box_c
      predicate: uniti:box_location
      value: Back room
