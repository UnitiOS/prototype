# Demonstration data, stated a second time under somebody else's vocabulary.
#
# Every movement below is the same movement as the one with the matching number
# in demo_data.yaml: same ingredient, same signed quantity, same day it
# happened, same day the log learned of it — including the delivery note for 12
# June that was not found until 10 July.
#
# What differs is every word. `Movement` not `StockMovement`, `qty_delta` not
# `movement_quantity`, `item` not `movement_ingredient`, `happened` not
# `movement_happened_on`, and the prefix is `rv:` throughout. @rival/stock-moves
# was written against @uniti/core alone and has never heard of @demo/inventory.
#
# The ingredients themselves are NOT restated. `item` points at `cat:ing_flour`,
# the entity @demo/catalog already registered, because identity lives in the
# kernel and is shared by everything that names it. A rival module replaces the
# words for what happened; it does not replace the things it happened to.
#
# So: if @demo/stock@v3 reads the same totals out of this as @demo/stock@v2
# reads out of demo_data.yaml, it is because both modules answered core's
# questions — not because anything was translated.

map: "@demo/stock@v3"
purpose: demonstration

actions:

  - action: add_stores
    actor: joko
    valid_from: '2026-01-22T00:00:00+00:00'
    occurred_at: '2026-01-22T09:00:00+00:00'
    recorded_at: '2026-01-22T09:00:00+00:00'
    note: Where things are kept, in this module's words.
    entities:
      - uri: rv:st_store
        class: Store
        facts: {store_ref: STORE, store_name: Dry store}
      - uri: rv:st_chill
        class: Store
        facts: {store_ref: CHILL, store_name: Chiller}

