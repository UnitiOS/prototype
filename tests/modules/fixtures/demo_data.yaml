# Demonstration data. None of this happened.
#
# A small bakery's first half-year, written as the actions that stated it.
# Every action here becomes one intent in the log, carrying `reason_code:
# demonstration`, so nobody reading the kernel has to be told which rows are
# made up.
#
# Two clocks are used on purpose, and the difference between them is the point:
#
#   valid_from   when it became true of the world — the day stock arrived.
#   recorded_at  when this log learned of it. Mostly the same week; twice it is
#                much later, because somebody found a delivery note in July for
#                a delivery in June.
#
# So moving `valid_at` back changes what is on hand, and moving `as_of` back to
# before 10 July hides the late-found delivery and changes it again.

map: "@demo/stock@v1"
purpose: demonstration

actions:
  - action: add_categories
    actor: rina
    valid_from: '2026-01-20T00:00:00+00:00'
    occurred_at: '2026-01-20T09:00:00+00:00'
    recorded_at: '2026-01-20T09:00:00+00:00'
    note: The three groups everything bought falls in.
    entities:
      - uri: cat:cat_dry
