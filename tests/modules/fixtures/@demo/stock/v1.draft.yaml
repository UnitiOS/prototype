id: https://uniti.example/stock
name: demo_stock
title: Stock
description: >-
  Demonstration data. The application. It declares no thing and no event of its
  own: it pins two modules and states one table somebody wants to look at —
  how much of each ingredient is here, the level below which they asked to be
  told, and the distance between the two.
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://w3id.org/uniti/core#
  stk: https://uniti.example/stock/
default_prefix: stk
default_range: string
imports:
  - linkml:types
  - "@uniti/core@v1"
  - "@demo/catalog@v2"
  - "@demo/inventory@v2"
classes:
  IngredientStock:
    description: >-
      One row per ingredient anything has moved for. Every column is derived;
      nothing states a row of this table, and dropping it loses nothing.
    slots:
      - stock_ingredient
      - quantity_on_hand
      - reorder_level
      - headroom
slots:
  stock_ingredient:
    title: Ingredient
    slot_uri: stk:stock_ingredient
    range: Ingredient
    description: The ingredient this row is about. The grouping, not a value.
  quantity_on_hand:
    title: On hand
    slot_uri: stk:quantity_on_hand
    range: decimal
    description: >-
      Every movement of this ingredient, added up. The movements belong to
      @demo/inventory; this module never sees one, it names the class and the
      slot and the log answers.
    annotations:
      aggregate:
        value:
          over: StockMovement
          sum: movement_quantity
          by: {stock_ingredient: movement_ingredient}
  reorder_level:
    title: Reorder level
    slot_uri: stk:reorder_level
    range: decimal
    description: >-
      What somebody said the level is, read off the ingredient this row groups
      by. It belongs to @demo/catalog. Where nobody has said one the cell is
      empty, which is not the same as nought.
    annotations:
      parameter:
        value: {of: stock_ingredient, slot: ingredient_reorder_level}
  headroom:
    title: Headroom
    slot_uri: stk:headroom
    range: decimal
    description: >-
      How far above the level this ingredient is. Negative means somebody
      should be told.
    equals_expression: "{quantity_on_hand} - {reorder_level}"
annotations:
  valid_from: '2026-05-15T00:00:00+00:00'
  transcript: v1.draft.txt
