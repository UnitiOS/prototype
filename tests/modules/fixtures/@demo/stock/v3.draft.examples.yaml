examples:
  flour_in_and_out:
    says: >-
      Flour came in twice, 25 kg each time, and 14 kg went into bread, so 36 kg
      are on hand. The reorder level was 20 kg until it was raised to 30 kg on
      1 July, so the headroom was 16 kg at the end of June and 6 kg after. The
      same business as v2, told in somebody else's inventory words.
    records:
      - record: flour
        class: Ingredient
        facts:
          ingredient_code: FLR
          ingredient_name: Wheat flour
          ingredient_unit: kg
          ingredient_reorder_level: 20
      - record: flour_in_1
        class: Movement
        when: '2026-06-02'
        facts: {move_ref: M1, item: flour, qty_delta: 25, happened: '2026-06-02'}
      - record: flour_in_2
        class: Movement
        when: '2026-06-16'
        facts: {move_ref: M2, item: flour, qty_delta: 25, happened: '2026-06-16'}
      - record: flour_used
        class: Movement
        when: '2026-06-20'
        facts: {move_ref: M3, item: flour, qty_delta: -14, happened: '2026-06-20'}
      - record: flour
        when: '2026-07-01'
        facts: {ingredient_reorder_level: 30}
    expect:
      - table: IngredientStock
        row: flour
        at: '2026-06-30'
        values: {quantity_on_hand: 36, reorder_level: 20, headroom: 16}
      - table: IngredientStock
        row: flour
        at: '2026-07-05'
        values: {quantity_on_hand: 36, reorder_level: 30, headroom: 6}
  no_level_no_headroom:
    says: >-
      Nobody has set a reorder level for salt, so salt has no headroom either:
      not a headroom of nought, but none at all.
    records:
      - record: salt
        class: Ingredient
        facts: {ingredient_code: SLT, ingredient_name: Salt, ingredient_unit: kg}
      - record: salt_in
        class: Movement
        facts: {move_ref: M1, item: salt, qty_delta: 5, happened: '2026-06-02'}
    expect:
      - table: IngredientStock
        row: salt
        values: {quantity_on_hand: 5, reorder_level: ~, headroom: ~}
