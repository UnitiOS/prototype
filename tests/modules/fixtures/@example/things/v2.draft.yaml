id: https://uniti.example/things
name: example_things
title: Things
prefixes:
  linkml: https://w3id.org/linkml/
  uniti: https://w3id.org/uniti/core#
  th: https://uniti.example/things/
default_prefix: th
default_range: string
imports:
  - linkml:types
  - "@uniti/core@v1"
classes:
  Thing:
    description: Something that can be counted.
    slots:
      - entity_class
      - thing_code
      - thing_name
      - thing_size
  ThingGroup:
    description: A named set of things.
    slots:
      - entity_class
      - group_code
slots:
  thing_code:
    slot_uri: th:thing_code
    identifier: true
  thing_name:
    slot_uri: th:thing_label
    description: What the thing is called. Renamed from thing_label; the predicate is unchanged.
  thing_size:
    slot_uri: th:thing_size
    range: decimal
  group_code:
    slot_uri: th:group_code
    identifier: true
annotations:
  valid_from: '2026-04-01T00:00:00+00:00'
  transcript: v2.draft.txt
